<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コーヒー醸造レシピ・テイスティングログ</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen">
<div class="max-w-5xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-center mb-1 text-amber-500">☕ コーヒーブリューレシピ日誌</h1>
  <p class="text-center text-stone-500 mb-8 text-sm">レシピ記録・味の評価・フレーバー分析</p>

  <!-- Add Form -->
  <div class="bg-stone-800 border border-stone-700 rounded-xl p-6 mb-6">
    <h2 class="text-base font-bold mb-4 text-amber-400">ブリューを追加</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
      <div>
        <label class="block text-xs text-stone-400 mb-1">豆の産地</label>
        <input id="origin" type="text" placeholder="例: エチオピア イルガチェフェ" class="w-full bg-stone-700 border border-stone-600 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-xs text-stone-400 mb-1">ロースト</label>
        <select id="roast" class="w-full bg-stone-700 border border-stone-600 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-amber-400">
          <option>ライト</option><option>ミディアム</option><option>ミディアムダーク</option><option>ダーク</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-stone-400 mb-1">抽出方法</label>
        <select id="method" class="w-full bg-stone-700 border border-stone-600 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-amber-400">
          <option>V60</option><option>French Press</option><option>Espresso</option><option>Aeropress</option><option>Cold Brew</option><option>Chemex</option><option>Moka Pot</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-stone-400 mb-1">グラインドサイズ</label>
        <select id="grind" class="w-full bg-stone-700 border border-stone-600 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-amber-400">
          <option>極細 (Espresso)</option><option>細 (Moka/AeroFine)</option><option>中細 (V60)</option><option>中 (Aeropress)</option><option>粗 (French Press)</option><option>極粗 (Cold Brew)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-stone-400 mb-1">湯温 (°C)</label>
        <input id="temp" type="number" placeholder="93" min="60" max="100" class="w-full bg-stone-700 border border-stone-600 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-xs text-stone-400 mb-1">比率 (豆:湯 g)</label>
        <input id="ratio" type="text" placeholder="1:15" class="w-full bg-stone-700 border border-stone-600 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-xs text-stone-400 mb-1">抽出時間</label>
        <input id="brewTime" type="text" placeholder="例: 2分30秒" class="w-full bg-stone-700 border border-stone-600 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-xs text-stone-400 mb-1">総合スコア: <span id="scoreLabel">80</span></label>
        <input id="score" type="range" min="1" max="100" value="80" class="w-full accent-amber-500 mt-1">
      </div>
    </div>

    <!-- Flavor Descriptors -->
    <div class="grid grid-cols-2 gap-4 mb-3">
      <div>
        <label class="block text-xs text-stone-400 mb-2">フレーバーノート（複数選択可）</label>
        <div id="flavorBtns" class="flex flex-wrap gap-1"></div>
      </div>
      <div class="space-y-2">
        <div>
          <div class="flex justify-between text-xs text-stone-400 mb-1"><span>酸味</span><span id="acidVal">3</span></div>
          <input id="acidity" type="range" min="1" max="5" value="3" class="w-full accent-amber-500">
        </div>
        <div>
          <div class="flex justify-between text-xs text-stone-400 mb-1"><span>甘み</span><span id="sweetVal">3</span></div>
          <input id="sweetness" type="range" min="1" max="5" value="3" class="w-full accent-amber-500">
        </div>
        <div>
          <div class="flex justify-between text-xs text-stone-400 mb-1"><span>ボディ</span><span id="bodyVal">3</span></div>
          <input id="body" type="range" min="1" max="5" value="3" class="w-full accent-amber-500">
        </div>
        <div>
          <div class="flex justify-between text-xs text-stone-400 mb-1"><span>後味</span><span id="finishVal">3</span></div>
          <input id="finishScore" type="range" min="1" max="5" value="3" class="w-full accent-amber-500">
        </div>
      </div>
    </div>

    <div class="mb-3">
      <label class="block text-xs text-stone-400 mb-1">テイスティングノート</label>
      <input id="tastingNote" type="text" placeholder="香り・味・特徴など" class="w-full bg-stone-700 border border-stone-600 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-amber-400">
    </div>
    <div id="addErr" class="text-red-400 text-xs mb-2 hidden"></div>
    <button onclick="addBrew()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded transition text-sm">記録する</button>
  </div>

  <!-- Filter -->
  <div class="flex gap-3 mb-4 flex-wrap">
    <select id="methodFilter" class="bg-stone-800 border border-stone-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-amber-400">
      <option value="">全抽出方法</option>
      <option>V60</option><option>French Press</option><option>Espresso</option><option>Aeropress</option><option>Cold Brew</option>
    </select>
    <span id="countLabel" class="text-stone-500 text-sm self-center"></span>
  </div>

  <!-- Best Score Highlight -->
  <div id="bestCard" class="hidden bg-gradient-to-r from-amber-900/40 to-stone-800 border border-amber-700 rounded-xl p-4 mb-6">
    <div class="text-xs text-amber-500 font-bold mb-1">🏆 最高スコアレシピ</div>
    <div id="bestContent"></div>
  </div>

  <!-- Recipe Cards Grid -->
  <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</div>

<script>
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const flavors = ['ベリー','シトラス','フローラル','チョコレート','キャラメル','ナッツ','スパイス','アーシー','フルーティ','クリーン','バランス','複雑'];
const methodColors = {V60:'amber',Espresso:'red','French Press':'stone',Aeropress:'green','Cold Brew':'blue',Chemex:'purple','Moka Pot':'orange'};

function getColor(method) {
  const c = methodColors[method] || 'stone';
  return { bg: `bg-${c}-900/40`, border: `border-${c}-700`, text: `text-${c}-400` };
}

// Build flavor buttons
const flavorDiv = document.getElementById('flavorBtns');
flavors.forEach(f => {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.textContent = f;
  btn.className = 'px-2 py-0.5 text-xs rounded border border-stone-600 text-stone-400 hover:border-amber-500 flavor-toggle';
  btn.dataset.val = f;
  btn.addEventListener('click', function() {
    this.classList.toggle('bg-amber-600'); this.classList.toggle('text-white');
    this.classList.toggle('border-amber-500'); this.classList.toggle('text-stone-400');
    this.classList.toggle('border-stone-600');
  });
  flavorDiv.appendChild(btn);
});

['acidity','sweetness','body','finishScore'].forEach(id => {
  const labels = {acidity:'acidVal',sweetness:'sweetVal',body:'bodyVal',finishScore:'finishVal'};
  document.getElementById(id).addEventListener('input', function() {
    document.getElementById(labels[id]).textContent = this.value;
  });
});
document.getElementById('score').addEventListener('input', function() {
  document.getElementById('scoreLabel').textContent = this.value;
});
document.getElementById('methodFilter').addEventListener('change', renderAll);

let brews = JSON.parse(localStorage.getItem('coffee_brews') || '[]');
function save() { localStorage.setItem('coffee_brews', JSON.stringify(brews)); }

function getSelectedFlavors() {
  return [...document.querySelectorAll('.flavor-toggle.bg-amber-600')].map(b => b.dataset.val);
}

function addBrew() {
  const origin = document.getElementById('origin').value.trim();
  const err = document.getElementById('addErr');
  if (!origin) { err.textContent = '豆の産地を入力してください'; err.classList.remove('hidden'); return; }
  err.classList.add('hidden');
  brews.push({
    id: Date.now(),
    origin, roast: document.getElementById('roast').value,
    method: document.getElementById('method').value,
    grind: document.getElementById('grind').value,
    temp: document.getElementById('temp').value || '-',
    ratio: document.getElementById('ratio').value || '-',
    brewTime: document.getElementById('brewTime').value || '-',
    score: parseInt(document.getElementById('score').value),
    flavors: getSelectedFlavors(),
    acidity: parseInt(document.getElementById('acidity').value),
    sweetness: parseInt(document.getElementById('sweetness').value),
    body: parseInt(document.getElementById('body').value),
    finish: parseInt(document.getElementById('finishScore').value),
    note: document.getElementById('tastingNote').value.trim(),
    date: new Date().toISOString().slice(0,10)
  });
  save();
  document.getElementById('origin').value = '';
  document.getElementById('temp').value = '';
  document.getElementById('ratio').value = '';
  document.getElementById('brewTime').value = '';
  document.getElementById('tastingNote').value = '';
  document.querySelectorAll('.flavor-toggle.bg-amber-600').forEach(b => {
    b.classList.remove('bg-amber-600','text-white','border-amber-500');
    b.classList.add('text-stone-400','border-stone-600');
  });
  renderAll();
}

function deleteBrew(id) { brews = brews.filter(b=>b.id!==id); save(); renderAll(); }

function renderAll() {
  const mf = document.getElementById('methodFilter').value;
  const data = mf ? brews.filter(b=>b.method===mf) : brews;
  const sorted = [...data].sort((a,b)=>b.score-a.score);
  document.getElementById('countLabel').textContent = `${data.length}件`;

  // Best card
  if (sorted.length) {
    const best = sorted[0];
    document.getElementById('bestCard').classList.remove('hidden');
    const c = document.getElementById('bestContent');
    const origin = document.createElement('div');
    origin.className = 'flex items-center gap-3';
    const nameEl = document.createElement('span');
    nameEl.className = 'font-bold text-amber-200';
    nameEl.textContent = `${best.origin} (${best.method})`;
    const scoreEl = document.createElement('span');
    scoreEl.className = 'text-2xl font-bold text-amber-400 ml-auto';
    scoreEl.textContent = `${best.score}`;
    origin.appendChild(nameEl); origin.appendChild(scoreEl);
    const details = document.createElement('div');
    details.className = 'text-xs text-stone-400 mt-1';
    details.textContent = `${best.grind} | ${best.temp}°C | ${best.ratio} | ${best.brewTime}`;
    if (best.note) {
      const note = document.createElement('div');
      note.className = 'text-xs text-stone-500 mt-1 italic';
      note.textContent = best.note;
      c.innerHTML = '';
      c.appendChild(origin); c.appendChild(details); c.appendChild(note);
    } else {
      c.innerHTML = '';
      c.appendChild(origin); c.appendChild(details);
    }
  } else {
    document.getElementById('bestCard').classList.add('hidden');
  }

  // Cards
  const grid = document.getElementById('recipeGrid');
  grid.innerHTML = '';
  if (!sorted.length) {
    const p = document.createElement('p');
    p.className = 'text-stone-600 col-span-3 text-center py-8';
    p.textContent = 'ブリュー記録がありません';
    grid.appendChild(p); return;
  }
  sorted.forEach(b => {
    const scoreColor = b.score >= 90 ? 'text-green-400' : b.score >= 80 ? 'text-amber-400' : b.score >= 70 ? 'text-yellow-500' : 'text-stone-400';
    const card = document.createElement('div');
    card.className = 'bg-stone-800 border border-stone-700 rounded-xl p-4';

    const header = document.createElement('div');
    header.className = 'flex justify-between items-start mb-2';
    const originEl = document.createElement('div');
    const nameDiv = document.createElement('div');
    nameDiv.className = 'font-medium text-stone-100 text-sm';
    nameDiv.textContent = b.origin;
    const methodDiv = document.createElement('div');
    methodDiv.className = 'text-xs text-stone-500';
    methodDiv.textContent = `${b.method} · ${b.roast}`;
    originEl.appendChild(nameDiv); originEl.appendChild(methodDiv);
    const scoreDiv = document.createElement('div');
    scoreDiv.className = `text-xl font-bold ${scoreColor}`;
    scoreDiv.textContent = b.score;
    header.appendChild(originEl); header.appendChild(scoreDiv);

    const params = document.createElement('div');
    params.className = 'grid grid-cols-3 gap-1 text-xs text-stone-500 mb-2';
    [[b.temp+'°C','湯温'],[b.ratio,'比率'],[b.brewTime,'時間']].forEach(([v,l]) => {
      const item = document.createElement('div');
      item.className = 'bg-stone-700/50 rounded p-1 text-center';
      const val = document.createElement('div');
      val.className = 'text-stone-300 font-mono';
      val.textContent = v;
      const lab = document.createElement('div');
      lab.className = 'text-stone-600';
      lab.textContent = l;
      item.appendChild(val); item.appendChild(lab);
      params.appendChild(item);
    });

    // Bars
    const bars = document.createElement('div');
    bars.className = 'space-y-1 mb-2';
    [['酸味',b.acidity,'amber'],['甘み',b.sweetness,'yellow'],['ボディ',b.body,'orange'],['後味',b.finish,'red']].forEach(([label,val,color]) => {
      const row = document.createElement('div');
      row.className = 'flex items-center gap-2';
      const lEl = document.createElement('span');
      lEl.className = 'text-xs text-stone-500 w-8';
      lEl.textContent = label;
      const barBg = document.createElement('div');
      barBg.className = 'flex-1 bg-stone-700 rounded-full h-1.5';
      const barFill = document.createElement('div');
      barFill.className = `bg-${color}-500 h-1.5 rounded-full`;
      barFill.style.width = `${val/5*100}%`;
      barBg.appendChild(barFill);
      row.appendChild(lEl); row.appendChild(barBg);
      bars.appendChild(row);
    });

    // Flavors
    const fRow = document.createElement('div');
    fRow.className = 'flex flex-wrap gap-1 mb-2';
    b.flavors.forEach(f => {
      const tag = document.createElement('span');
      tag.className = 'px-1.5 py-0.5 text-xs bg-amber-900/40 text-amber-500 border border-amber-800 rounded';
      tag.textContent = f;
      fRow.appendChild(tag);
    });

    const footer = document.createElement('div');
    footer.className = 'flex justify-between items-center text-xs text-stone-600';
    const dateEl = document.createElement('span');
    dateEl.textContent = b.date;
    const delBtn = document.createElement('button');
    delBtn.className = 'text-red-800 hover:text-red-500';
    delBtn.textContent = '削除';
    delBtn.addEventListener('click', () => deleteBrew(b.id));
    footer.appendChild(dateEl); footer.appendChild(delBtn);

    if (b.note) {
      const noteEl = document.createElement('div');
      noteEl.className = 'text-xs text-stone-500 italic mb-2';
      noteEl.textContent = b.note;
      card.append(header, params, bars, fRow, noteEl, footer);
    } else {
      card.append(header, params, bars, fRow, footer);
    }
    grid.appendChild(card);
  });
}

// Sample data
if (brews.length === 0) {
  brews = [
    {id:1,origin:'エチオピア イルガチェフェ',roast:'ライト',method:'V60',grind:'中細 (V60)',temp:'93',ratio:'1:15',brewTime:'2分45秒',score:92,flavors:['ベリー','フローラル','シトラス'],acidity:5,sweetness:4,body:2,finish:4,note:'ジャスミンとブルーベリーの香り',date:'2026-11-10'},
    {id:2,origin:'コロンビア ウイラ',roast:'ミディアム',method:'Aeropress',grind:'中 (Aeropress)',temp:'88',ratio:'1:12',brewTime:'2分00秒',score:85,flavors:['チョコレート','キャラメル','ナッツ'],acidity:3,sweetness:4,body:4,finish:3,note:'',date:'2026-11-05'},
    {id:3,origin:'ブラジル セラード',roast:'ミディアムダーク',method:'French Press',grind:'粗 (French Press)',temp:'96',ratio:'1:17',brewTime:'4分00秒',score:78,flavors:['ナッツ','チョコレート','アーシー'],acidity:2,sweetness:3,body:5,finish:3,note:'重厚なボディ感',date:'2026-10-28'},
  ]; save();
}

renderAll();
</script>
</body>
</html>
